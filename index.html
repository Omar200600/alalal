<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فصل الفيزياء الافتراضي للاستاذ عمرحسان.عبره  - أكسيس 3D</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        .a-dialog, .a-dialog-container, .a-enter-vr, .a-enter-ar { display: none !important; visibility: hidden !important; pointer-events: none !important; }

        #nav-panel { position: fixed; top: 10px; right: 10px; z-index: 9999; background: white; border: 2px solid #D4AF37; padding: 10px; border-radius: 10px; width: 140px; }

        #chat-panel {
            position: fixed;
            bottom: 20px;
            right: 10px;
            width: 290px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #D4AF37;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: sans-serif;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #chat-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #38bdf8; text-align: center; }
        #chat-history {
            height: 110px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-box { display: flex; gap: 5px; }
        input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 12px;
        }
        .btn-send { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-action { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; }

        .control-btn { position: fixed; width: 55px; height: 55px; background: rgba(212, 175, 55, 0.9); border: 2px solid white; border-radius: 50%; z-index: 9999; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; touch-action: none; font-size: 20px; user-select: none; }
        #up { bottom: 120px; left: 80px; } 
        #down { bottom: 20px; left: 80px; } 
        #left { bottom: 70px; left: 20px; } 
        #right { bottom: 70px; left: 140px; }
    </style>
</head>
<body>

    <div id="nav-panel">
        <button class="btn-action" style="background:#8B4513;" onclick="window.location.href='corridor.html'">🏃 العودة للممر</button>
    </div>

    <div id="chat-panel">
        <h3>👨‍🏫 معلم الفيزياء الافتراضي</h3>
        <div id="chat-history">
            <div><b>المعلم:</b> أهلاً بك في فصل الفيزياء! اسألني عن أي قانون أو مفهوم فيزيائي.</div>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="اسأل المعلم..." onkeydown="if(event.key==='Enter') askTeacher()">
            <button class="btn-send" onclick="askTeacher()">إرسال</button>
        </div>
    </div>

    <!-- أزرار التحكم بالحركة -->
    <div id="up" class="control-btn">↑</div>
    <div id="down" class="control-btn">↓</div>
    <div id="left" class="control-btn">←</div>
    <div id="right" class="control-btn">→</div>

    <canvas id="videoCanvas" width="512" height="768" style="display:none;"></canvas>

    <a-scene light="defaultLightsEnabled: false" vr-mode-ui="enabled: false">
        
        <a-assets>
            <!-- الفيديو صامت كلياً ليتكرر بدون إزعاج -->
            <video id="teacherVideo" src="teacher-video.mp4" loop autoplay muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- إضاءة المشهد -->
        <a-entity light="type: ambient; color: #FFF; intensity: 3.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.8" position="-1 4 2"></a-entity>

        <!-- الأرضية والجدران -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#E0F7FA" src="https://images.unsplash.com/photo-1523821741446-edb2b68bb7a0?auto=format&fit=crop&w=500&q=80" repeat="10 10" material="shader: flat;"></a-plane> 
        
        <a-box position="0 4 -10" width="20" height="8" depth="0.2" color="#FFFDD0" src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=500&q=80" repeat="1 1" material="shader: flat;"></a-box> 
        <a-box position="0 4 10" width="20" height="8" depth="0.2" color="#FFFDD0" src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=500&q=80" repeat="1 1" material="shader: flat;"></a-box> 
        <a-box position="-10 4 0" width="0.2" height="8" depth="20" color="#F5F5DC" src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=500&q=80" repeat="1 1" material="shader: flat;"></a-box> 
        <a-box position="10 4 0" width="0.2" height="8" depth="20" color="#F5F5DC" src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&w=500&q=80" repeat="1 1" material="shader: flat;"></a-box> 
        
        <a-box position="0 8 0" width="20" height="0.1" depth="20" color="#FFFFFF" material="shader: flat;"></a-box> 

        <!-- لافتة الفصل -->
        <a-box position="0 6.5 -9.8" width="7" height="1" depth="0.1" color="#8B4513" material="shader: flat;">
            <a-text value="PHYSICS CLASSROOM 101" align="center" position="0 0 0.1" color="#D4AF37" width="10"></a-text>
        </a-box>

        <!-- السبورة التعليمية -->
        <a-box position="1 3.8 -9.8" width="8.4" height="4.2" depth="0.08" color="#5c3a21" material="shader: flat;"></a-box>
        <a-box position="1 3.8 -9.7" width="8" height="3.8" depth="0.08" color="#0B6623" material="shader: flat;">
            <a-text id="blackboard-text" value="Welcome to Physics Class!\nF = m * a" position="0 0 0.06" align="center" width="7" color="#FFFFFF"></a-text>
        </a-box>

        <!-- أفتار المعلم (مفرغ الكروما) -->
        <a-entity id="teacher-avatar-container" position="-4.5 2.5 -9.5">
            <a-plane id="avatarBox" width="2.8" height="4.2" material="shader: flat; transparent: true; side: double;"></a-plane>
            <a-text value="Physics Teacher AI" position="0 2.3 0" align="center" width="5" color="#D4AF37"></a-text>
        </a-entity>

        <!-- الكراسي -->
        <a-entity id="chairs-matrix">
            <a-entity position="-3 0 -3.5" rotation="0 180 0">
                <a-box position="-0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.45 0" width="0.5" height="0.05" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.7 -0.2" width="0.5" height="0.45" depth="0.05" color="#FF69B4" material="shader: flat;"></a-box>
            </a-entity>
            <a-entity position="0 0 -3.5" rotation="0 180 0">
                <a-box position="-0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.45 0" width="0.5" height="0.05" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.7 -0.2" width="0.5" height="0.45" depth="0.05" color="#FF69B4" material="shader: flat;"></a-box>
            </a-entity>
            <a-entity position="3 0 -3.5" rotation="0 180 0">
                <a-box position="-0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0.225 0.225 0" width="0.05" height="0.45" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.45 0" width="0.5" height="0.05" depth="0.45" color="#FF69B4" material="shader: flat;"></a-box>
                <a-box position="0 0.7 -0.2" width="0.5" height="0.45" depth="0.05" color="#FF69B4" material="shader: flat;"></a-box>
            </a-entity>
        </a-entity>

        <!-- الكاميرا -->
        <a-entity id="rig" position="0 1.6 4">
            <a-entity id="head" camera look-controls></a-entity>
        </a-entity>
    </a-scene>

    <script>
        var video = document.getElementById('teacherVideo');
        var canvas = document.getElementById('videoCanvas');
        var ctx = canvas.getContext('2d');
        var avatarBox = document.getElementById('avatarBox');
        var canvasTexture = null;
        var isSetupDone = false;
        var hasWelcomed = false;

        function initAvatarChroma() {
            if (isSetupDone) return;
            isSetupDone = true;

            // تشغيل الفيديو بشكل صامت للتكرار الحركي فقط
            video.muted = true;
            video.play().catch(e => console.log("خطأ بالتشغيل:", e));

            // نطق الترحيب لمرة واحدة فقط عند دخول الفصل
            if (!hasWelcomed) {
                hasWelcomed = true;
                speak("أهلاً بك في فصل الفيزياء الافتراضي! اسألني عن أي قانون أو مفهوم فيزيائي وسأجيبك فوراً.");
            }

            canvasTexture = new THREE.CanvasTexture(canvas);
            var mesh = avatarBox.getObject3D('mesh');
            if (mesh) {
                mesh.material.map = canvasTexture;
                mesh.material.transparent = true;
                mesh.material.needsUpdate = true;
            }

            function processFrame() {
                if (!video.paused && !video.ended) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var l = frame.data.length / 4;

                    for (var i = 0; i < l; i++) {
                        var r = frame.data[i * 4 + 0];
                        var g = frame.data[i * 4 + 1];
                        var b = frame.data[i * 4 + 2];

                        // تفريغ الكروما الخضراء
                        if (g > 90 && r < 140 && b < 140 && g > r * 1.1) {
                            frame.data[i * 4 + 3] = 0;
                        }
                    }
                    ctx.putImageData(frame, 0, 0);
                    if (canvasTexture) canvasTexture.needsUpdate = true;
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();
        }

        // بدء المشهد والترحيب بمجرد أول لمسة للشاشة
        window.addEventListener('touchstart', initAvatarChroma, {once: true});
        window.addEventListener('click', initAvatarChroma, {once: true});

        // منطق أزرار التحكم بالحركة
        var rig = document.getElementById('rig');
        var head = document.getElementById('head');
        var keys = {up: false, down: false, left: false, right: false};

        function setupBtn(id, k) {
            var b = document.getElementById(id);
            if (!b) return;

            var start = (e) => { e.preventDefault(); keys[k] = true; };
            var end = (e) => { e.preventDefault(); keys[k] = false; };

            b.addEventListener('touchstart', start, {passive: false});
            b.addEventListener('touchend', end, {passive: false});
            b.addEventListener('mousedown', start);
            b.addEventListener('mouseup', end);
            b.addEventListener('mouseleave', end);
        }

        setupBtn('up', 'up');
        setupBtn('down', 'down');
        setupBtn('left', 'left');
        setupBtn('right', 'right');

        // حلقة التحديث المستمر للحركة
        setInterval(() => {
            if (!rig || !head) return;
            var pos = rig.getAttribute('position');
            var rot = head.getAttribute('rotation');
            var ang = rot.y * Math.PI / 180;
            var s = 0.15; // سرعة الحركة
            
            let nextX = pos.x;
            let nextZ = pos.z;

            if(keys.up){ nextX -= Math.sin(ang)*s; nextZ -= Math.cos(ang)*s; }
            if(keys.down){ nextX += Math.sin(ang)*s; nextZ += Math.cos(ang)*s; }
            if(keys.left){ nextX -= Math.cos(ang)*s; nextZ += Math.sin(ang)*s; }
            if(keys.right){ nextX += Math.cos(ang)*s; nextZ -= Math.sin(ang)*s; }

            // قيود حدود الجدران
            if (nextX > -9.0 && nextX < 9.0 && nextZ > -9.0 && nextZ < 9.0) {
                pos.x = nextX;
                pos.z = nextZ;
                rig.setAttribute('position', pos);
            }
        }, 20);

        // الدردشة والتفاعل
        function askTeacher() {
            const input = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const blackboardText = document.getElementById('blackboard-text');
            const text = input.value.trim();

            if (!text) return;

            chatHistory.innerHTML += `<div><b>أنت:</b> ${text}</div>`;
            input.value = '';

            let response = generateTeacherResponse(text);

            setTimeout(() => {
                chatHistory.innerHTML += `<div style="color:#38bdf8;"><b>المعلم:</b> ${response.speech}</div>`;
                chatHistory.scrollTop = chatHistory.scrollHeight;

                blackboardText.setAttribute('value', response.boardText);
                speak(response.speech);
            }, 400);
        }

        function generateTeacherResponse(question) {
            const q = question.toLowerCase();
            if (q.includes('نيوتن') || q.includes('قوة') || q.includes('newton')) {
                return {
                    speech: "قانون نيوتن الثاني ينص على أن القوة تساوي الكتلة مضروبة في التسارع.",
                    boardText: "Newton's 2nd Law:\nF = m * a\nF: Force | m: Mass | a: Acc."
                };
            } else if (q.includes('سرعة') || q.includes('تسارع') || q.includes('حركة')) {
                return {
                    speech: "السرعة هي معدل تغير المسافة بالنسبة للزمن، والتسارع هو معدل تغير السرعة.",
                    boardText: "Motion Equations:\nv = d / t\na = (v2 - v1) / t"
                };
            } else {
                return {
                    speech: "سؤال ممتاز! في الفيزياء نحول المفاهيم إلى معادلات رياضية لنفهم الكون.",
                    boardText: `Topic: ${question}\nStatus: Active Discussion`
                };
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
