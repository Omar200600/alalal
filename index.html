<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فصل الفيزياء الافتراضي - أكسيس 3D</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        .a-dialog, .a-dialog-container, .a-enter-vr, .a-enter-ar { display: none !important; visibility: hidden !important; pointer-events: none !important; }

        #welcome-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        #welcome-modal button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        #nav-panel { position: fixed; top: 10px; right: 10px; z-index: 9999; background: white; border: 2px solid #D4AF37; padding: 10px; border-radius: 10px; width: 140px; }

        #chat-panel {
            position: fixed;
            bottom: 20px;
            right: 10px;
            width: 300px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #D4AF37;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: sans-serif;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #chat-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #38bdf8; text-align: center; }
        #chat-history {
            height: 110px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-box { display: flex; gap: 5px; align-items: center; }
        input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 12px;
        }
        .btn-send { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-mic { background: #e11d48; color: white; border: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-action { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; }

        .control-btn { 
            position: fixed; 
            width: 60px; 
            height: 60px; 
            background: rgba(212, 175, 55, 0.9); 
            border: 2px solid white; 
            border-radius: 50%; 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: bold; 
            touch-action: manipulation; 
            font-size: 22px; 
            user-select: none;
            -webkit-user-select: none;
        }
        #up { bottom: 135px; left: 85px; } 
        #down { bottom: 15px; left: 85px; } 
        #left { bottom: 75px; left: 15px; } 
        #right { bottom: 75px; left: 155px; }
    </style>
</head>
<body>

    <div id="welcome-modal">
        <h2>مرحباً بك في فصل الفيزياء الافتراضي منصة أكسيس 3D</h2>
        <p>اضغط للبدء والاستماع لترحيب معلم الفيزياء</p>
        <button onclick="startClassroom()">دخول الفصل 🚪</button>
    </div>

    <div id="nav-panel">
        <button class="btn-action" style="background:#8B4513;" onclick="window.location.href='corridor.html'">🏃 العودة للممر</button>
        <button class="btn-action" style="background:#0284c7;" onclick="replayWelcome()">🔊 إعادة الترحيب</button>
    </div>

    <div id="chat-panel">
        <h3>👨‍🏫 معلم الفيزياء الافتراضي</h3>
        <div id="chat-history">
            <div><b>المعلم:</b> أهلاً بك! يمكنك السؤال كتابةً أو استخدام زر المايك للسؤال بصوتك.</div>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="اسأل المعلم..." onkeydown="if(event.key==='Enter') askTeacher()">
            <button class="btn-mic" id="mic-btn" onclick="startVoiceInput()" title="تحدث بصوتك">🎙️</button>
            <button class="btn-send" onclick="askTeacher()">إرسال</button>
        </div>
    </div>

    <div id="up" class="control-btn">↑</div>
    <div id="down" class="control-btn">↓</div>
    <div id="left" class="control-btn">←</div>
    <div id="right" class="control-btn">→</div>

    <canvas id="videoCanvas" width="512" height="768" style="display:none;"></canvas>

    <a-scene light="defaultLightsEnabled: false" vr-mode-ui="enabled: false">
        
        <a-assets>
            <video id="teacherVideo" src="teacher-video.mp4" loop autoplay muted playsinline webkit-playsinline crossorigin="anonymous"></video>
            <img id="marbleTile" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80" crossorigin="anonymous">
        </a-assets>

        <a-entity light="type: ambient; color: #FFF; intensity: 3.0"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.5" position="-1 5 2"></a-entity>

        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" src="#marbleTile" repeat="8 8" material="shader: flat; roughness: 0.2;"></a-plane> 
        
        <a-box position="0 4 -10" width="20" height="8" depth="0.2" color="#FFFDD0" material="shader: flat;"></a-box> 
        <a-box position="0 4 10" width="20" height="8" depth="0.2" color="#FFFDD0" material="shader: flat;"></a-box> 
        <a-box position="-10 4 0" width="0.2" height="8" depth="20" color="#F5F5DC" material="shader: flat;"></a-box> 
        <a-box position="10 4 0" width="0.2" height="8" depth="20" color="#F5F5DC" material="shader: flat;"></a-box> 
        
        <a-box position="0 8 0" width="20" height="0.1" depth="20" color="#FFFFFF" material="shader: flat;"></a-box> 

        <a-box position="0 6.5 -9.8" width="7" height="1" depth="0.1" color="#8B4513" material="shader: flat;">
            <a-text value="PHYSICS CLASSROOM 101" align="center" position="0 0 0.1" color="#D4AF37" width="10"></a-text>
        </a-box>

        <a-box position="1 3.8 -9.8" width="8.4" height="4.2" depth="0.08" color="#5c3a21" material="shader: flat;"></a-box>
        <a-box position="1 3.8 -9.7" width="8" height="3.8" depth="0.08" color="#0B6623" material="shader: flat;">
            <a-text id="blackboard-text" value="Welcome to Physics Class!\nF = m * a" position="0 0 0.06" align="center" width="7" color="#FFFFFF"></a-text>
        </a-box>

        <!-- أفتار المعلم (تم ضبط الموقع Y=2.1 ليكون واقفا على الأرض مباشرة) -->
        <a-entity id="teacher-avatar-container" position="-4.5 2.1 -9.5">
            <a-plane id="avatarBox" width="2.8" height="4.2" material="shader: flat; transparent: true; opacity: 0; side: double;"></a-plane>
            <a-text value="Physics Teacher AI" position="0 2.3 0" align="center" width="5" color="#D4AF37"></a-text>
        </a-entity>

        <!-- الكراسي الحجم الجديد والممر الواسع -->
        <a-entity id="chairs-matrix">
            <a-entity position="-5 0 -2" rotation="0 180 0">
                <a-box position="-0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 0.9 0" width="1.1" height="0.1" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 1.5 -0.45" width="1.1" height="1.0" depth="0.1" color="#8B0000" material="shader: flat;"></a-box>
            </a-entity>
            <a-entity position="-5 0 2" rotation="0 180 0">
                <a-box position="-0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 0.9 0" width="1.1" height="0.1" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 1.5 -0.45" width="1.1" height="1.0" depth="0.1" color="#8B0000" material="shader: flat;"></a-box>
            </a-entity>

            <a-entity position="5 0 -2" rotation="0 180 0">
                <a-box position="-0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 0.9 0" width="1.1" height="0.1" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 1.5 -0.45" width="1.1" height="1.0" depth="0.1" color="#8B0000" material="shader: flat;"></a-box>
            </a-entity>
            <a-entity position="5 0 2" rotation="0 180 0">
                <a-box position="-0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0.5 0.5 0" width="0.1" height="1.0" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 0.9 0" width="1.1" height="0.1" depth="1.0" color="#8B0000" material="shader: flat;"></a-box>
                <a-box position="0 1.5 -0.45" width="1.1" height="1.0" depth="0.1" color="#8B0000" material="shader: flat;"></a-box>
            </a-entity>
        </a-entity>

        <!-- الكاميرا: تم تحسين الارتفاع لمستوى النظر البشري الطبيعي مباشرة تجاه الأفتار -->
        <a-entity id="rig" position="0 1.8 3">
            <a-entity id="head" camera look-controls position="0 0 0"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        var video = document.getElementById('teacherVideo');
        var canvas = document.getElementById('videoCanvas');
        var ctx = canvas.getContext('2d');
        var avatarBox = document.getElementById('avatarBox');
        var canvasTexture = null;

        const welcomeSpeech = "مرحباً بك عزيزي الزائر في فصل الفيزياء الافتراضي الخاص بـ أكسيس 3D. أنا معلمك الافتراضي، يمكنك السؤال كتابةً أو بالصوت وسأكون سعيداً بإجابتك!";

        function startClassroom() {
            document.getElementById('welcome-modal').style.display = 'none';

            video.muted = true;
            video.play().then(() => {
                initChromaTexture();
            }).catch(e => console.log(e));

            setTimeout(() => {
                speak(welcomeSpeech);
            }, 500);

            function processFrame() {
                if (!video.paused && !video.ended && video.readyState >= 2) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var l = frame.data.length / 4;

                    for (var i = 0; i < l; i++) {
                        var r = frame.data[i * 4 + 0];
                        var g = frame.data[i * 4 + 1];
                        var b = frame.data[i * 4 + 2];

                        if (g > 90 && r < 140 && b < 140 && g > r * 1.1) {
                            frame.data[i * 4 + 3] = 0;
                        }
                    }
                    ctx.putImageData(frame, 0, 0);
                    if (canvasTexture) canvasTexture.needsUpdate = true;
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();
        }

        function initChromaTexture() {
            canvasTexture = new THREE.CanvasTexture(canvas);
            var mesh = avatarBox.getObject3D('mesh');
            if (mesh) {
                mesh.material.map = canvasTexture;
                mesh.material.transparent = true;
                mesh.material.opacity = 1;
                mesh.material.needsUpdate = true;
            }
        }

        function replayWelcome() {
            speak(welcomeSpeech);
        }

        var rig = document.getElementById('rig');
        var head = document.getElementById('head');
        var keys = {up: false, down: false, left: false, right: false};

        function setupBtn(id, k) {
            var b = document.getElementById(id);
            if (!b) return;

            var start = (e) => { e.preventDefault(); keys[k] = true; };
            var end = (e) => { e.preventDefault(); keys[k] = false; };

            b.addEventListener('touchstart', start, {passive: false});
            b.addEventListener('touchend', end, {passive: false});
            b.addEventListener('mousedown', start);
            b.addEventListener('mouseup', end);
            b.addEventListener('mouseleave', end);
        }

        setupBtn('up', 'up');
        setupBtn('down', 'down');
        setupBtn('left', 'left');
        setupBtn('right', 'right');

        setInterval(() => {
            if (!rig || !head) return;
            var pos = rig.getAttribute('position');
            var rot = head.getAttribute('rotation');
            var ang = rot.y * Math.PI / 180;
            var s = 0.35;
            
            let nextX = pos.x;
            let nextZ = pos.z;

            if(keys.up){ nextX -= Math.sin(ang)*s; nextZ -= Math.cos(ang)*s; }
            if(keys.down){ nextX += Math.sin(ang)*s; nextZ += Math.cos(ang)*s; }
            if(keys.left){ nextX -= Math.cos(ang)*s; nextZ += Math.sin(ang)*s; }
            if(keys.right){ nextX += Math.cos(ang)*s; nextZ -= Math.sin(ang)*s; }

            if (nextX > -9.0 && nextX < 9.0 && nextZ > -9.0 && nextZ < 9.0) {
                pos.x = nextX;
                pos.z = nextZ;
                rig.setAttribute('position', pos);
            }
        }, 16);

        function askTeacher() {
            const input = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');
            const blackboardText = document.getElementById('blackboard-text');
            const text = input.value.trim();

            if (!text) return;

            chatHistory.innerHTML += `<div><b>أنت:</b> ${text}</div>`;
            input.value = '';

            let response = generateTeacherResponse(text);

            setTimeout(() => {
                chatHistory.innerHTML += `<div style="color:#38bdf8;"><b>المعلم:</b> ${response.speech}</div>`;
                chatHistory.scrollTop = chatHistory.scrollHeight;

                blackboardText.setAttribute('value', response.boardText);
                speak(response.speech);
            }, 300);
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("المتصفح لا يدعم التعرف الصوتي المباشر. استخدم الكتابة.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.background = '#22c55e';

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('user-input').value = text;
                micBtn.style.background = '#e11d48';
                askTeacher();
            };

            recognition.onerror = function() {
                micBtn.style.background = '#e11d48';
            };

            recognition.onend = function() {
                micBtn.style.background = '#e11d48';
            };

            recognition.start();
        }

        function generateTeacherResponse(question) {
            const q = question.toLowerCase();
            if (q.includes('نيوتن') || q.includes('قوة') || q.includes('newton')) {
                return {
                    speech: "قانون نيوتن الثاني ينص على أن القوة تساوي الكتلة مضروبة في التسارع.",
                    boardText: "Newton's 2nd Law:\nF = m * a\nF: Force | m: Mass | a: Acc."
                };
            } else if (q.includes('سرعة') || q.includes('تسارع') || q.includes('حركة')) {
                return {
                    speech: "السرعة هي معدل تغير المسافة بالنسبة للزمن، والتسارع هو معدل تغير السرعة.",
                    boardText: "Motion Equations:\nv = d / t\na = (v2 - v1) / t"
                };
            } else {
                return {
                    speech: "سؤال ممتاز! في الفيزياء نحول المفاهيم إلى معادلات رياضية لنفهم الكون.",
                    boardText: `Topic: ${question}\nStatus: Active Discussion`
                };
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
